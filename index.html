<!doctype html>
<html lang="tr" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Deprem Olasılık" />
    <meta
      name="description"
      content="Türkiye Deprem Olasılık Haritası: BPT, Lognormal, Weibull bilimsel yenilenme modelleri ve gerçek zamanlı UDES deprem verileri."
    />
    <!-- Preconnect to Map Tile & Telemetry Origins for Fast Mobile Handshake -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" crossorigin />
    <link rel="dns-prefetch" href="https://tile.openstreetmap.org" />
    <link rel="preconnect" href="https://api.udesquake.com.tr" crossorigin />
    <link rel="dns-prefetch" href="https://api.udesquake.com.tr" />

    <link rel="icon" type="image/svg+xml" href="./pwa-icon.svg" />
    <link rel="apple-touch-icon" href="./pwa-icon.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Türkiye Deprem Olasılık Haritası | Earthquake Probability Mapper</title>
    <style>
      /* Instant Mobile Critical Shell Skeleton before JS hydration */
      body {
        margin: 0;
        background-color: #020617;
        color: #f8fafc;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .initial-shell {
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #020617;
        color: #fbbf24;
        font-size: 13px;
        font-weight: 600;
      }
      .initial-spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(245, 158, 11, 0.25);
        border-top-color: #f59e0b;
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-shell">
        <div class="initial-spinner"></div>
        <div>Türkiye Deprem Olasılık Haritası Yükleniyor...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
